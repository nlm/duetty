# poly config. Auto-loaded from <user config dir>/poly/config.toml (e.g.
# ~/.config/poly/config.toml) if it exists; or pass `poly -config PATH`.
# ./config.toml in the working directory is NOT read unless given via -config.
# Precedence: explicit flag > this file > OPENAI_API_KEY (key only) > defaults.
# Unknown keys are an error. Do not commit a file containing api_key.

languages = ["fr", "en"]          # exactly two Whisper codes; first = left pane (-langs fr,en)
base_url = "https://api.scaleway.ai/<project_id>/v1"  # REQUIRED, no default: OpenAI-compatible
                                  # endpoint (-base-url). The default models are Scaleway names.
# api_key = ""                    # or env OPENAI_API_KEY
stt_model = "whisper-large-v3"    # -stt-model
translate_model = "mistral-small-3.2-24b-instruct-2506"  # -translate-model
translate_context = 4             # previous utterances given to translator (-translate-context)
timestamps = false                # -timestamps
# mic_device = ""                 # -mic; empty = default input; "off" = no audio capture
                                  # (typed input only; no VAD/Silero/Smart Turn loaded)
# onnxruntime_lib = ""            # path to libonnxruntime (-onnxruntime-lib); empty = look for
                                  # third_party/onnxruntime/lib/libonnxruntime.so next to the poly
                                  # binary, else the system search

# Default model/runtime paths are resolved ONLY next to the (symlink-resolved)
# poly binary, never the current directory. `go run` builds into a temp dir, so
# either pass these paths explicitly or `go build -o poly ./cmd/poly` in the
# repo root after scripts/setup-models.sh.

# Silero VAD (required)
# silero_vad_model = ""           # -silero-vad-model; empty = models/silero_vad.onnx next to the
                                  # poly binary (scripts/setup-models.sh)
silero_vad_threshold = 0.6        # 0..1 exclusive (-silero-vad-threshold)
vad_min_speech_ms = 250           # -vad-min-speech-ms
vad_silence_ms = 900              # -vad-silence-ms
vad_onset_ms = 200
vad_prebuf_ms = 500
trim_margin_ms = 150

# Smart Turn end-of-utterance (missing model => fixed silence)
smart_turn = true                 # -smart-turn
# smart_turn_model = ""           # -smart-turn-model; empty = models/smart-turn/smart-turn-v3.2-cpu.onnx
                                  # next to the poly binary
smart_turn_threshold = 0.5
smart_turn_pause_ms = 200
smart_turn_recheck_ms = 600
smart_turn_max_silence_ms = 2500

# Local noise suppression before VAD/Whisper (GTCRN; scripts/setup-denoise.sh;
# missing model => off)
denoise = false                   # -denoise
# denoise_model = ""              # -denoise-model; empty = models/denoise/gtcrn_simple.onnx
                                  # next to the poly binary

# Noise rejection thresholds (calibrated, see eval/README.md)
noise_logprob_floor = -1.0
noise_max_compression = 2.4

# log_file = ""                   # -log-file; timings/errors only, never conversation text
