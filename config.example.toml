# duetty configuration
#
# Where duetty looks for it:
#   - ~/.config/duetty/config.toml ($XDG_CONFIG_HOME/duetty/config.toml) if it exists;
#   - or the file given with -config PATH.
#   A config.toml in the current directory is never read unless named with -config.
#
# Precedence: command-line flag > this file > environment > built-in default.
# Unknown keys are an error.
#
# Every key below shows its default, commented out. Uncomment only what you
# change. "(-flag)" names the matching command-line flag; "(file only)" keys
# have none.

# --- API -------------------------------------------------------------------
# Any OpenAI-compatible API with a speech-to-text model and a chat model.

# API endpoint for both services. Required unless both endpoints below are
# set. No default, so your key only ever goes to a provider you chose.
# Must be https (http is allowed for localhost only).
# Environment: DUETTY_API_URL, then OPENAI_BASE_URL. (-api-url)
api_url = "https://api.scaleway.ai/<project_id>/v1"

# Separate endpoints for speech-to-text and translation, when they are not
# both at api_url: e.g. a local Whisper server and a local Ollama (see
# docs/offline.md). api_url may then be left unset. (-stt-api-url,
# -translate-api-url)
# stt_api_url = ""
# translate_api_url = ""

# Keys for those endpoints. api_key is only ever sent to api_url's own server,
# never to a separate endpoint elsewhere; local servers need no key. Prefer
# the environment: DUETTY_STT_API_KEY, DUETTY_TRANSLATE_API_KEY. (file only)
# stt_api_key = ""
# translate_api_key = ""

# API key for api_url. Not needed when both endpoints are on localhost. Prefer the
# environment: DUETTY_API_KEY, then OPENAI_API_KEY. Never commit a file that
# contains a key. (file only)
# api_key = ""

# Speech-to-text model. (-stt-model)
# stt_model = "whisper-large-v3"

# Translation model. (-translate-model)
# translate_model = "mistral-small-3.2-24b-instruct-2506"

# Previous sentences given to the translator as context. (-translate-context)
# translate_context = 4

# --- Conversation ------------------------------------------------------------

# The two Whisper language codes; the first one is the left pane. (-languages, -langs)
# languages = ["fr", "en"]

# Show times next to sentences. (-timestamps)
# timestamps = false

# Microphone: "" = system default, a device name or number, or "off" for
# typed input only (no audio models are loaded). (-mic)
# mic = ""

# --- Live preview ------------------------------------------------------------
# Shows text and its translation while someone is still speaking, by sending
# the growing recording to Whisper again. Raises transcription cost to about
# 4x the audio at most. false = one transcription per turn.

# (-live-preview)
# live_preview = true

# Minimum time between two refreshes, in ms; at least 100. (file only)
# live_preview_interval_ms = 1000

# --- Cost estimate -----------------------------------------------------------
# The status bar always counts tokens and audio. A cost estimate is added only
# when all three prices are set. There are no default prices. (file only)
# For reference, Scaleway: whisper-large-v3 0.003 EUR/min; mistral-small-3.2
# 0.15 EUR in / 0.35 EUR out per million tokens.

# Price per minute of audio.
# price_audio_per_min = 0.003

# Price per million input (prompt) tokens.
# price_in_per_mtok = 0.15

# Price per million output (completion) tokens.
# price_out_per_mtok = 0.35

# Label shown before the estimate, e.g. "€".
# price_currency = ""

# --- Local models ------------------------------------------------------------
# Empty paths are looked up next to the duetty binary only, never in the current
# directory: run scripts/setup-models.sh, then `go build -o duetty ./cmd/duetty`
# in the repo root.

# onnxruntime shared library. "" = third_party/onnxruntime/lib/ next to the
# binary, else the system library search. (-onnxruntime-lib)
# onnxruntime_lib = ""

# --- Voice activity (Silero VAD) ---------------------------------------------

# Silero VAD model. "" = models/silero_vad.onnx. (-vad-model)
# vad_model = ""

# Speech probability above which audio counts as speech, between 0 and 1.
# (-vad-threshold)
# vad_threshold = 0.6

# Shortest speech sent to transcription, in ms; shorter sounds are dropped
# as noise. (-vad-min-speech-ms)
# vad_min_speech_ms = 250

# How long speech must last before a turn starts, in ms. (file only)
# vad_onset_ms = 200

# Audio kept from just before speech starts, so the first syllable is not
# cut, in ms. (file only)
# vad_pre_speech_ms = 500

# Silence kept around the speech when the edges of a recording are trimmed,
# in ms. (file only)
# vad_trim_margin_ms = 150

# Silence that ends a turn when Smart Turn is off or its model is missing, in
# ms. (-vad-end-silence-ms)
# vad_end_silence_ms = 900

# --- End of turn (Smart Turn) ------------------------------------------------
# Smart Turn decides from the audio whether the speaker has finished, so a
# pause inside a sentence does not end the turn.

# (-smart-turn)
# smart_turn = true

# Smart Turn model. "" = models/smart-turn/smart-turn-v3.2-cpu.onnx.
# (-smart-turn-model)
# smart_turn_model = ""

# Probability above which Smart Turn's "finished" is accepted, between 0 and
# 1. (file only)
# smart_turn_threshold = 0.5

# Silence before Smart Turn is first asked, in ms. (file only)
# smart_turn_pause_ms = 200

# Further silence after which it is asked again, in ms. (file only)
# smart_turn_recheck_ms = 600

# Silence that ends the turn without asking, in ms. (file only)
# smart_turn_max_silence_ms = 2500

# --- Noise -------------------------------------------------------------------

# Local noise suppression (GTCRN) before voice detection and transcription.
# Needs scripts/setup-denoise.sh. (-denoise)
# denoise = false

# Denoiser model. "" = models/denoise/gtcrn_simple.onnx. (-denoise-model)
# denoise_model = ""

# Whisper results below this average log-probability are dropped as noise.
# Calibrated, see eval/README.md. (file only)
# noise_min_logprob = -1.0

# Whisper results above this compression ratio (repetitive output) are dropped
# as noise. (file only)
# noise_max_compression = 2.4

# --- Context -----------------------------------------------------------------

# Markdown file describing the conversation: people, brands, terms. It is sent
# with every translation, so keep it short (duetty warns above ~2000 tokens).
# "" = none. See docs/context.md. (-context)
# context_file = ""

# Send a per-language hint to Whisper, from the file's "Whisper hint" section
# or generated at startup. Needs context_file. Off by default: in the eval a
# hint made Whisper drop one badly recorded short clip (see eval/README.md).
# Turn it on if Whisper keeps mishearing unusual names. (-whisper-hint)
# whisper_hint = false

# Fix words Whisper misheard in the speaker's pane, never rephrasing. Works
# without a context file; typed text is never corrected. false = translate the
# text as heard. (-correct)
# correct = true

# Show the corrected words in blue. (-mark-corrections)
# mark_corrections = true

# --- Logging -----------------------------------------------------------------

# Log file for timings, states and errors. Never contains conversation text or
# the API key. "" = no log. (-log-file)
# log_file = ""
